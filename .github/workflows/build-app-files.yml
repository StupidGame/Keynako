name: Build app files

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: app-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate the Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Validate Flutter and Android code
        run: |
          flutter analyze
          flutter test
          (cd android && ./gradlew :app:testDebugUnitTest)

      - name: Restore the stable CI signing key
        uses: actions/cache@v4
        with:
          path: .ci/keynako-ci-release.jks
          key: keynako-ci-release-signing-v1

      - name: Create or reuse the CI signer and build the APK
        shell: bash
        run: |
          set -euo pipefail
          signing_password="keynako-ci-release-v1"
          keystore_path="$GITHUB_WORKSPACE/.ci/keynako-ci-release.jks"
          mkdir -p "$(dirname "$keystore_path")"

          if [[ ! -f "$keystore_path" ]]; then
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -storepass "$signing_password" \
              -keypass "$signing_password" \
              -alias keynako-ci \
              -keyalg RSA \
              -keysize 4096 \
              -validity 3650 \
              -dname "CN=Keynako GitHub Actions, OU=CI, O=Keynako, L=Tokyo, C=JP"
          fi

          export KEYNAKO_KEYSTORE_PATH="$keystore_path"
          export KEYNAKO_STORE_PASSWORD="$signing_password"
          export KEYNAKO_KEY_ALIAS="keynako-ci"
          export KEYNAKO_KEY_PASSWORD="$signing_password"
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"

      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -f "$apk_path"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee build/app/outputs/flutter-apk/signature-report.txt

      - name: Upload Android files
        uses: actions/upload-artifact@v7
        with:
          name: keynako-android-signed-apk-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/signature-report.txt

  ios:
    name: Unsigned iOS files
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build the unsigned device app
        run: >-
          flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER"
          --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          device_app="build/ios/iphoneos/Runner.app"
          package_root="$RUNNER_TEMP/keynako-unsigned"
          test -d "$device_app"
          test ! -d "$device_app/_CodeSignature"
          mkdir -p "$package_root/Payload"
          cp -R "$device_app" "$package_root/Payload/Keynako.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ios/Keynako-unsigned.ipa" Payload
          )

      - name: Build and package the Simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"
          simulator_app="build/ios/iphonesimulator/Runner.app"
          test -d "$simulator_app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$simulator_app" \
            build/ios/Keynako-simulator.app.zip

      - name: Write artifact information
        shell: bash
        run: |
          {
            echo "Keynako-unsigned.ipa is not signed and must be signed with an Apple-issued certificate and provisioning profiles before installing on a physical device."
            echo "Keynako-simulator.app.zip can be extracted and installed in an iOS Simulator."
            echo "No Apple credentials or repository secrets were used by this workflow."
          } > build/ios/ARTIFACTS.txt

      - name: Upload iOS files
        uses: actions/upload-artifact@v7
        with:
          name: keynako-ios-files-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/Keynako-unsigned.ipa
            build/ios/Keynako-simulator.app.zip
            build/ios/ARTIFACTS.txt
