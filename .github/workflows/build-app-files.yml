name: Build app files

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: app-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate the Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Validate Flutter and Android code
        run: |
          flutter analyze
          flutter test
          (cd android && ./gradlew :app:testDebugUnitTest)

      - name: Restore the stable CI signing key
        uses: actions/cache@v5
        with:
          path: .ci/keynako-ci-release.jks
          key: keynako-ci-release-signing-v1

      - name: Create or reuse the CI signer and build the APK
        shell: bash
        run: |
          set -euo pipefail
          signing_password="keynako-ci-release-v1"
          keystore_path="$GITHUB_WORKSPACE/.ci/keynako-ci-release.jks"
          mkdir -p "$(dirname "$keystore_path")"

          if [[ ! -f "$keystore_path" ]]; then
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -storepass "$signing_password" \
              -keypass "$signing_password" \
              -alias keynako-ci \
              -keyalg RSA \
              -keysize 4096 \
              -validity 3650 \
              -dname "CN=Keynako GitHub Actions, OU=CI, O=Keynako, L=Tokyo, C=JP"
          fi

          export KEYNAKO_KEYSTORE_PATH="$keystore_path"
          export KEYNAKO_STORE_PASSWORD="$signing_password"
          export KEYNAKO_KEY_ALIAS="keynako-ci"
          export KEYNAKO_KEY_PASSWORD="$signing_password"
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"

      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -f "$apk_path"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path" | tee build/app/outputs/flutter-apk/signature-report.txt

      - name: Upload Android files
        uses: actions/upload-artifact@v7
        with:
          name: keynako-android-signed-apk-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/signature-report.txt

  ios:
    name: Unsigned iOS files
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build the unsigned device app
        run: >-
          flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER"
          --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          device_app="build/ios/iphoneos/Runner.app"
          package_root="$RUNNER_TEMP/keynako-unsigned"
          test -d "$device_app"
          test ! -d "$device_app/_CodeSignature"
          mkdir -p "$package_root/Payload"
          cp -R "$device_app" "$package_root/Payload/Keynako.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ios/Keynako-unsigned.ipa" Payload
          )

      - name: Build and package the Simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=KEYNAKO_DICTIONARY_SUBMISSION_URL="${{ vars.KEYNAKO_DICTIONARY_SUBMISSION_URL }}"
          simulator_app="build/ios/iphonesimulator/Runner.app"
          test -d "$simulator_app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$simulator_app" \
            build/ios/Keynako-simulator.app.zip

      - name: Write artifact information
        shell: bash
        run: |
          {
            echo "Keynako-unsigned.ipa is not signed and must be signed with an Apple-issued certificate and provisioning profiles before installing on a physical device."
            echo "Keynako-simulator.app.zip can be extracted and installed in an iOS Simulator."
            echo "No Apple credentials or repository secrets were used by this workflow."
          } > build/ios/ARTIFACTS.txt

      - name: Upload iOS files
        uses: actions/upload-artifact@v7
        with:
          name: keynako-ios-files-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ios/Keynako-unsigned.ipa
            build/ios/Keynako-simulator.app.zip
            build/ios/ARTIFACTS.txt

  desktop-tests:
    name: Desktop conversion tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test the shared conversion module
        working-directory: packages/keynako_conversion
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Analyze and test the desktop input app
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter analyze
          flutter test

  desktop-windows:
    name: Windows desktop IME
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the Zenzai runtime
        shell: pwsh
        run: |
          cmake -S packages/keynako_conversion/native -B build/zenzai -A x64 -DBUILD_TESTING=ON
          cmake --build build/zenzai --config Release --parallel 2 --target keynako_zenzai keynako_ime_core_test keynako_ime_c_api_test
          ctest --test-dir build/zenzai -C Release --output-on-failure

      - name: Build the Windows TSF input service
        shell: pwsh
        run: |
          cmake -S platforms/windows -B build/windows-ime -A x64
          cmake --build build/windows-ime --config Release --parallel 2

      - name: Build the Flutter desktop app
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter build windows --release --build-number=${{ github.run_number }}

      - name: Stage the Windows app, TSF service, and Zenzai
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'Keynako-package'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Recurse -Force 'apps/desktop/build/windows/x64/runner/Release/*' $packageRoot
          Move-Item -LiteralPath (Join-Path $packageRoot 'keynako_desktop.exe') -Destination (Join-Path $packageRoot 'Keynako.exe')
          $imeRoot = Join-Path $packageRoot 'ime'
          New-Item -ItemType Directory -Force -Path $imeRoot | Out-Null
          Copy-Item -Force 'build/windows-ime/Release/KeynakoIME.dll' $imeRoot
          Copy-Item -Force 'build/zenzai/Release/keynako_zenzai.exe' $imeRoot
          New-Item -ItemType Directory -Force -Path (Join-Path $imeRoot 'zenzai') | Out-Null
          Copy-Item -Recurse -Force 'assets/zenz-v3.2-small-gguf' (Join-Path $imeRoot 'zenzai')
          Copy-Item -Recurse -Force 'assets/zenz-v3.2-xsmall-gguf' (Join-Path $imeRoot 'zenzai')

      - name: Build the executable Windows installer and uninstaller
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $packageRoot = Join-Path $env:RUNNER_TEMP 'Keynako-package'
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'build/windows-installer'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc "/DPackageRoot=$packageRoot" "/DOutputDir=$outputRoot" 'platforms/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-FileHash -Algorithm SHA256 (Join-Path $outputRoot 'KeynakoSetup.exe') |
            ForEach-Object { "$($_.Hash.ToLower())  KeynakoSetup.exe" } |
            Set-Content -Encoding ascii (Join-Path $outputRoot 'KeynakoSetup.exe.sha256')

      - name: Upload the Windows desktop app
        uses: actions/upload-artifact@v7
        with:
          name: keynako-windows-installer-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows-installer/KeynakoSetup.exe
            build/windows-installer/KeynakoSetup.exe.sha256

  desktop-linux:
    name: Linux desktop IME
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev python3-gi gir1.2-ibus-1.0 ibus

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the Zenzai runtime
        run: |
          cmake -S packages/keynako_conversion/native -B build/zenzai -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/zenzai --parallel 2
          ctest --test-dir build/zenzai --output-on-failure

      - name: Validate the IBus engine
        run: |
          python3 -m py_compile platforms/linux/keynako_engine.py
          python3 -c "import gi; gi.require_version('IBus', '1.0'); from gi.repository import IBus"

      - name: Build the Flutter desktop app
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter build linux --release --build-number=${{ github.run_number }}

      - name: Package the Linux app and IBus engine with Zenzai
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/Keynako"
          cp -R apps/desktop/build/linux/x64/release/bundle "$package_root"
          cp build/zenzai/keynako_zenzai "$package_root/"
          cp build/zenzai/libkeynako_ime_bridge.so "$package_root/"
          cp platforms/linux/keynako_engine.py platforms/linux/keynako.xml.in \
            platforms/linux/install-ime.sh platforms/linux/uninstall-ime.sh "$package_root/"
          chmod +x "$package_root/keynako_engine.py" "$package_root/keynako_zenzai" "$package_root/"*.sh
          mkdir -p "$package_root/zenzai"
          cp -R assets/zenz-v3.2-small-gguf "$package_root/zenzai/"
          cp -R assets/zenz-v3.2-xsmall-gguf "$package_root/zenzai/"
          tar -C "$RUNNER_TEMP" -czf build/Keynako-linux-x64.tar.gz Keynako

      - name: Upload the Linux desktop app
        uses: actions/upload-artifact@v7
        with:
          name: keynako-linux-x64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: build/Keynako-linux-x64.tar.gz

  desktop-macos:
    name: macOS desktop IME
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the Zenzai runtime
        run: |
          cmake -S packages/keynako_conversion/native -B build/zenzai -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/zenzai --parallel 2
          ctest --test-dir build/zenzai --output-on-failure

      - name: Build the InputMethodKit input service
        run: bash platforms/macos/build-input-method.sh build/macos-ime

      - name: Build the Flutter desktop app
        working-directory: apps/desktop
        run: |
          flutter pub get
          flutter build macos --release --build-number=${{ github.run_number }}

      - name: Package the macOS app and input method with Zenzai
        shell: bash
        run: |
          set -euo pipefail
          source_app="apps/desktop/build/macos/Build/Products/Release/Keynako.app"
          package_root="$RUNNER_TEMP/Keynako-macos"
          package_app="$package_root/Keynako.app"
          input_method="$package_root/Keynako.inputmethod"
          test -d "$source_app"
          mkdir -p "$package_root"
          cp -R "$source_app" "$package_app"
          cp build/zenzai/keynako_zenzai "$package_app/Contents/MacOS/"
          chmod +x "$package_app/Contents/MacOS/keynako_zenzai"
          mkdir -p "$package_app/Contents/Resources/zenzai"
          cp -R assets/zenz-v3.2-small-gguf "$package_app/Contents/Resources/zenzai/"
          cp -R assets/zenz-v3.2-xsmall-gguf "$package_app/Contents/Resources/zenzai/"
          codesign --force --sign - "$package_app/Contents/MacOS/keynako_zenzai"
          codesign --force --deep --sign - \
            --entitlements apps/desktop/macos/Runner/Release.entitlements \
            "$package_app"

          cp -R build/macos-ime/Keynako.inputmethod "$input_method"
          cp build/zenzai/keynako_zenzai "$input_method/Contents/Resources/"
          chmod +x "$input_method/Contents/Resources/keynako_zenzai"
          mkdir -p "$input_method/Contents/Resources/zenzai"
          cp -R assets/zenz-v3.2-small-gguf "$input_method/Contents/Resources/zenzai/"
          cp -R assets/zenz-v3.2-xsmall-gguf "$input_method/Contents/Resources/zenzai/"
          cp platforms/macos/install-input-method.sh platforms/macos/uninstall-input-method.sh "$package_root/"
          chmod +x "$package_root/"*.sh
          codesign --force --deep --sign - "$input_method"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$package_root" build/Keynako-macos.zip

      - name: Upload the macOS desktop app
        uses: actions/upload-artifact@v7
        with:
          name: keynako-macos-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: build/Keynako-macos.zip
